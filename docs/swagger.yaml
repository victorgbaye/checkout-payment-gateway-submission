basePath: /
definitions:
  api.pong:
    properties:
      message:
        type: string
    type: object
  models.ErrorResponse:
    properties:
      error:
        example: bank unavailable
        type: string
    required:
    - error
    type: object
  models.PostPaymentRequest:
    properties:
      amount:
        example: 100
        minimum: 1
        type: integer
      card_number:
        example: "2222405343248877"
        maxLength: 19
        minLength: 14
        type: string
      currency:
        enum:
        - GBP
        - USD
        - EUR
        example: GBP
        type: string
      cvv:
        example: "012"
        maxLength: 4
        minLength: 3
        type: string
      expiry_month:
        example: 12
        maximum: 12
        minimum: 1
        type: integer
      expiry_year:
        example: 2099
        maximum: 9999
        minimum: 1
        type: integer
    required:
    - amount
    - card_number
    - currency
    - cvv
    - expiry_month
    - expiry_year
    type: object
  models.PostPaymentResponse:
    properties:
      amount:
        type: integer
      card_number_last_four:
        example: "8877"
        maxLength: 4
        minLength: 4
        type: string
      currency:
        type: string
      expiry_month:
        type: integer
      expiry_year:
        type: integer
      id:
        type: string
      payment_status:
        enum:
        - Authorized
        - Declined
        example: Authorized
        type: string
    type: object
  models.RejectedPaymentResponse:
    properties:
      error:
        example: 'invalid payment: amount must be positive'
        type: string
      payment_status:
        enum:
        - Rejected
        example: Rejected
        type: string
    required:
    - error
    - payment_status
    type: object
host: localhost:8090
info:
  contact: {}
  description: Interview challenge for building a Payment Gateway - Go version
  title: Payment Gateway Challenge Go
  version: "1.0"
paths:
  /api/payments:
    post:
      consumes:
      - application/json
      description: Accepts one JSON object, at most 4096 bytes. Unknown fields are
        rejected. Expiry is valid through the end of its month in UTC. Authorized
        and declined payments are both stored and returned with HTTP 201. Invalid
        input never reaches the bank.
      parameters:
      - description: Payment details
        in: body
        name: payment
        required: true
        schema:
          $ref: '#/definitions/models.PostPaymentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Authorized or declined payment
          schema:
            $ref: '#/definitions/models.PostPaymentResponse'
        "400":
          description: Invalid JSON or payment details
          schema:
            $ref: '#/definitions/models.RejectedPaymentResponse'
        "413":
          description: Body exceeds 4096 bytes
          schema:
            $ref: '#/definitions/models.RejectedPaymentResponse'
        "500":
          description: Internal processing error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "502":
          description: Invalid bank response
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "503":
          description: Bank unavailable
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Process a payment
      tags:
      - payments
  /api/payments/{id}:
    get:
      parameters:
      - description: Gateway payment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PostPaymentResponse'
        "404":
          description: Payment not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Retrieve a payment
      tags:
      - payments
  /ping:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.pong'
      summary: Check gateway health
swagger: "2.0"
